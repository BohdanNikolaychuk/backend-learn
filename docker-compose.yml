services:
  learn-postgres:
    image: postgres:18.1-bookworm
    container_name: learn-env-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - ./out/pgdata:/var/lib/postgresql
    ports:
      - "${POSTGRES_PORT}:5432"
    restart: always
    networks:
      - backend

  learn-postgres-migrate:
    image: migrate/migrate:v4.20.1
    volumes:
      - ./migration:/migrations
    networks:
      - backend
    depends_on:
      - learn-postgres

networks:
  backend:
    driver: bridge
